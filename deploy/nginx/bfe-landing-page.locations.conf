# BFE landing page hosting locations.
#
# Shared-VPS mode: install this file under the Backend-owned generic extension
# directory and include it inside the existing public HTTPS server block.
# This repository owns only the public landing page and its own static assets.

location = / {
    alias /var/www/bfe-landing-page/index.html;
}

location = /styles.css {
    alias /var/www/bfe-landing-page/styles.css;
}
